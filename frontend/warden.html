<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hostel Fix — Warden Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      color: #1a1a1a;
      padding: 20px;
    }
    .header {
      max-width: 1100px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-left h1 { font-size: 24px; color: #0d3b66; }
    .back {
      font-size: 13px;
      color: #0d3b66;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      background: #e8f0fe;
      display: inline-block;
      margin-bottom: 8px;
    }
    .back:hover { background: #d3e2fb; }
    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      padding: 8px 14px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      font-size: 13px;
      flex-wrap: wrap;
    }
    .user-info strong { color: #0d3b66; }
    .user-info a {
      color: #0d3b66;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      background: #e8f0fe;
      font-size: 12px;
      font-weight: 600;
    }
    .user-info a:hover { background: #d3e2fb; }
    .logout-btn {
      background: #b3261e;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .logout-btn:hover { background: #8a1c16; }
    .stats { display: flex; gap: 12px; flex-wrap: wrap; }
    .stat {
      background: #ffffff;
      padding: 8px 14px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      font-size: 13px;
    }
    .stat strong { color: #0d3b66; font-size: 15px; }

    .tabs {
      max-width: 1100px;
      margin: 0 auto 16px;
      display: flex;
      gap: 4px;
      border-bottom: 1px solid #e0e4e8;
    }
    .tab {
      padding: 10px 18px;
      border: none;
      background: none;
      font-size: 14px;
      font-weight: 600;
      color: #666;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      font-family: inherit;
    }
    .tab.active { color: #0d3b66; border-bottom-color: #0d3b66; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .search-bar {
      max-width: 1100px;
      margin: 0 auto 12px;
      background: #ffffff;
      padding: 12px 14px;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .search-bar input.search {
      flex: 1;
      min-width: 220px;
      padding: 10px 14px;
      border: 1px solid #ccd3da;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: #fafbfc;
    }
    .search-bar input.search:focus {
      outline: none;
      border-color: #0d3b66;
      background: #ffffff;
    }
    .search-bar .clear-search {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #ccd3da;
      background: #ffffff;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }

    .controls {
      max-width: 1100px;
      margin: 0 auto 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      background: #ffffff;
      padding: 12px 14px;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .controls label { font-size: 12px; font-weight: 600; color: #555; margin-right: -4px; }
    .controls input, .controls select {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #ccd3da;
      font-size: 14px;
      background: #ffffff;
      font-family: inherit;
    }
    .controls button.primary {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      background: #0d3b66;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .controls button.print,
    .controls button.csv {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #ccd3da;
      background: #ffffff;
      color: #0d3b66;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .controls button.print:hover,
    .controls button.csv:hover { background: #f0f3f7; }
    .last-updated { font-size: 12px; color: #888; margin-left: auto; }
    .list { max-width: 1100px; margin: 0 auto; display: grid; gap: 12px; }
    .card {
      background: #ffffff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      border-left: 5px solid #8899aa;
      display: grid;
      gap: 10px;
    }
    .card.priority-EMERGENCY { border-left-color: #d32f2f; }
    .card.priority-NORMAL    { border-left-color: #1976d2; }
    .card.status-PENDING      { background: #fffdf5; }
    .card.status-ASSIGNED     { background: #f5faff; }
    .card.status-RESOLVED     { background: #f4fbf6; }
    .card.status-CLOSED       { background: #f4f6f8; opacity: 0.75; }
    .card.status-REOPENED     { background: #fff5f5; }
    .card.status-REJECTED     { background: #f8f8f8; opacity: 0.7; }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #0d3b66;
      font-family: monospace;
    }
    .card-subtitle {
      font-size: 14px;
      color: #333;
      font-weight: 600;
      margin-top: 2px;
    }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #eef1f5;
      color: #333;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .badge.EMERGENCY  { background: #fdecea; color: #b3261e; }
    .badge.PENDING    { background: #fff4d6; color: #8a6300; }
    .badge.ASSIGNED   { background: #e3f0ff; color: #1a4fa0; }
    .badge.RESOLVED   { background: #e6f4ea; color: #1e7e34; }
    .badge.CLOSED     { background: #e8eaed; color: #555; }
    .badge.REOPENED   { background: #fdecea; color: #b3261e; }
    .badge.REJECTED   { background: #f0f0f0; color: #555; }
    .meta { font-size: 13px; color: #555; line-height: 1.55; }
    .meta strong { color: #333; }

    .attribution {
      background: #f8fafc;
      border-left: 3px solid #cbd5e1;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      color: #475569;
      line-height: 1.6;
    }
    .attribution strong { color: #334155; }
    .rated-badge {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      margin-left: 6px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 8px;
      border-top: 1px dashed #e0e4e8;
      align-items: center;
    }
    .actions button {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #ccd3da;
      background: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .actions button:hover { background: #f0f3f7; }
    .actions button.assign { background: #0d3b66; color: white; border-color: #0d3b66; }
    .actions button.change-staff { background: #f0ad00; color: #333; border-color: #f0ad00; }
    .actions button.resolve { background: #1e7e34; color: white; border-color: #1e7e34; }
    .actions button.reject  { background: #b3261e; color: white; border-color: #b3261e; }
    .actions button.reopen  { background: #f0ad00; color: #333; border-color: #f0ad00; }

    .empty { text-align: center; padding: 40px; color: #888; background: #ffffff; border-radius: 10px; }
    .loading { text-align: center; padding: 30px; color: #666; }

    .worker-card {
      background: #ffffff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      border-left: 5px solid #0d3b66;
      display: grid;
      gap: 8px;
      max-width: 1100px;
      margin: 0 auto 12px;
    }
    .worker-name { font-size: 16px; font-weight: 700; color: #0d3b66; }
    .worker-stats { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: #555; }
    .worker-stats strong { color: #333; }
    .worker-stars { color: #f5b301; font-size: 16px; letter-spacing: 2px; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }
    .modal-box {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .modal-box h3 {
      font-size: 18px;
      color: #0d3b66;
      margin-bottom: 6px;
    }
    .modal-sub {
      font-size: 13px;
      color: #666;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .modal-box input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #ccd3da;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      background: #fafbfc;
    }
    .modal-box input:focus {
      outline: none;
      border-color: #0d3b66;
      background: #ffffff;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 18px;
    }
    .modal-buttons button {
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #ccd3da;
      background: #ffffff;
      font-family: inherit;
    }
    .modal-buttons button.primary {
      background: #0d3b66;
      color: white;
      border-color: #0d3b66;
    }
    .modal-buttons button.primary:disabled {
      background: #8899aa;
      cursor: not-allowed;
    }
    .modal-buttons button:hover:not(:disabled) { opacity: 0.9; }
    .modal-err {
      margin-top: 10px;
      color: #b3261e;
      font-size: 13px;
      display: none;
    }

    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea {
        position: absolute;
        left: 0; top: 0;
        width: 100%;
        padding: 20px;
      }
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="header print-hidden">
    <div class="header-left">
      <a href="index.html" class="back">← Home</a>
      <h1>Warden Dashboard</h1>
    </div>
    <div class="user-info" id="userInfo" style="display:none;">
      <span>👤 <strong id="userName"></strong> <span id="userRole"></span></span>
      <a href="change-password.html">Change Password</a>
      <a href="admin.html" id="adminLink" style="display:none;">Admin Panel</a>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </div>

  <div class="tabs print-hidden" id="primaryTabs">
    <button class="tab active" data-tab="complaints">📋 Complaints</button>
    <button class="tab" data-tab="workers">👷 Worker Performance</button>
  </div>

  <div class="tab-panel active" id="panel-complaints">

    <div class="tabs print-hidden" id="secondaryTabs" style="max-width:1100px; margin: 0 auto 12px;">
      <button class="tab active" data-subtab="active" id="tabActive">🔴 Active (<span id="countActive">0</span>)</button>
      <button class="tab" data-subtab="solved" id="tabSolved">✅ Solved (<span id="countSolved">0</span>)</button>
    </div>

    <div class="stats print-hidden" id="stats" style="max-width:1100px; margin: 0 auto 12px;"></div>

    <div class="search-bar print-hidden">
      <input
        type="text"
        class="search"
        id="searchInput"
        placeholder="🔍 Search by code, room, student name, roll, worker..."
      />
      <button class="clear-search" id="clearSearchBtn">Clear</button>
    </div>

    <div class="controls print-hidden">
      <label for="filterHostel">Hostel</label>
      <input type="text" id="filterHostel" placeholder="e.g., KP-25J" style="width:120px;" />

      <label for="filterStatus">Status</label>
      <select id="filterStatus">
        <option value="">All</option>
        <option value="PENDING">Pending</option>
        <option value="ASSIGNED">Assigned</option>
        <option value="RESOLVED">Resolved</option>
        <option value="CLOSED">Closed</option>
        <option value="REOPENED">Reopened</option>
        <option value="REJECTED">Rejected</option>
      </select>

      <button class="primary" id="refreshBtn">Refresh</button>
      <button class="print" id="printTaskListBtn" title="Print active tasks">🖨️ Print Task List</button>
      <button class="csv" id="exportCsvBtn" title="Download all complaints as CSV">📥 Export CSV</button>
      <span class="last-updated" id="lastUpdated"></span>
    </div>

    <div class="list print-hidden" id="list">
      <div class="loading">Loading complaints...</div>
    </div>

    <div id="printArea" class="hidden"></div>
  </div>

  <div class="tab-panel" id="panel-workers">
    <div id="workerList" style="max-width:1100px; margin: 0 auto;">
      <div class="loading">Loading worker performance...</div>
    </div>
  </div>

  <script>
    var listEl = document.getElementById('list');
    var statsEl = document.getElementById('stats');
    var filterStatusEl = document.getElementById('filterStatus');
    var filterHostelEl = document.getElementById('filterHostel');
    var searchInputEl = document.getElementById('searchInput');
    var clearSearchBtn = document.getElementById('clearSearchBtn');
    var refreshBtn = document.getElementById('refreshBtn');
    var printTaskListBtn = document.getElementById('printTaskListBtn');
    var exportCsvBtn = document.getElementById('exportCsvBtn');
    var lastUpdatedEl = document.getElementById('lastUpdated');
    var userInfoEl = document.getElementById('userInfo');
    var userNameEl = document.getElementById('userName');
    var userRoleEl = document.getElementById('userRole');
    var adminLink = document.getElementById('adminLink');
    var logoutBtn = document.getElementById('logoutBtn');
    var printArea = document.getElementById('printArea');
    var workerListEl = document.getElementById('workerList');
    var countActiveEl = document.getElementById('countActive');
    var countSolvedEl = document.getElementById('countSolved');

    var allComplaints = [];
    var currentUser = null;
    var currentSubTab = 'active';
    var autoRefreshTimer = null;
    var modalOpen = false;

    var ACTIVE_STATUSES = ['PENDING', 'ASSIGNED', 'REOPENED'];
    var SOLVED_STATUSES = ['RESOLVED', 'CLOSED', 'REJECTED'];

    function isActiveComplaint(c) { return ACTIVE_STATUSES.indexOf(c.status) !== -1; }
    function isSolvedComplaint(c) { return SOLVED_STATUSES.indexOf(c.status) !== -1; }

    // Primary tabs
    var primaryTabButtons = document.querySelectorAll('#primaryTabs .tab');
    for (var i = 0; i < primaryTabButtons.length; i++) {
      (function(btn) {
        btn.addEventListener('click', function() {
          var tabs = document.querySelectorAll('#primaryTabs .tab');
          for (var j = 0; j < tabs.length; j++) tabs[j].classList.remove('active');
          var panels = document.querySelectorAll('.tab-panel');
          for (var k = 0; k < panels.length; k++) panels[k].classList.remove('active');
          btn.classList.add('active');
          document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
          if (btn.dataset.tab === 'workers') loadWorkers();
        });
      })(primaryTabButtons[i]);
    }

    // Secondary tabs
    var secondaryTabButtons = document.querySelectorAll('#secondaryTabs .tab');
    for (var m = 0; m < secondaryTabButtons.length; m++) {
      (function(btn) {
        btn.addEventListener('click', function() {
          var tabs = document.querySelectorAll('#secondaryTabs .tab');
          for (var j = 0; j < tabs.length; j++) tabs[j].classList.remove('active');
          btn.classList.add('active');
          currentSubTab = btn.dataset.subtab;
          render();
        });
      })(secondaryTabButtons[m]);
    }

    async function checkAuth() {
      try {
        var res = await fetch('/api/auth/me');
        if (res.status === 401) {
          window.location.href = 'login.html';
          return false;
        }
        var data = await res.json();
        currentUser = data.user;

        if (currentUser.role === 'warden' && currentUser.must_change_password) {
          window.location.href = 'change-password.html?force=1';
          return false;
        }

        userNameEl.textContent = currentUser.full_name || currentUser.username;
        userRoleEl.textContent = '(' + currentUser.role +
          (currentUser.hostel ? ' — ' + currentUser.hostel : '') + ')';
        userInfoEl.style.display = 'flex';

        if (currentUser.role === 'admin') {
          adminLink.style.display = 'inline-block';
        }

        if (currentUser.role === 'warden' && currentUser.hostel) {
          filterHostelEl.value = currentUser.hostel;
          filterHostelEl.disabled = true;
        }
        return true;
      } catch (err) {
        window.location.href = 'login.html';
        return false;
      }
    }

    logoutBtn.addEventListener('click', async function() {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = 'login.html';
    });

    function formatDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString();
    }

    function timeAgo(iso) {
      if (!iso) return '';
      var diff = Date.now() - new Date(iso).getTime();
      var mins = Math.floor(diff / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + ' min ago';
      var hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + ' hr ago';
      var days = Math.floor(hrs / 24);
      return days + ' day' + (days > 1 ? 's' : '') + ' ago';
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function complaintCode(c) {
      return c.complaint_code || ('HF-' + String(c.id).padStart(4, '0'));
    }

    function renderStats() {
      var counts = {
        total: allComplaints.length,
        pending: 0, assigned: 0, resolved: 0,
        reopened: 0, emergency: 0
      };
      for (var i = 0; i < allComplaints.length; i++) {
        var c = allComplaints[i];
        if (c.status === 'PENDING') counts.pending++;
        if (c.status === 'ASSIGNED') counts.assigned++;
        if (c.status === 'RESOLVED') counts.resolved++;
        if (c.status === 'REOPENED') counts.reopened++;
        if (c.priority === 'EMERGENCY') counts.emergency++;
      }
      statsEl.innerHTML = '' +
        '<div class="stat">Total: <strong>' + counts.total + '</strong></div>' +
        '<div class="stat">Pending: <strong>' + counts.pending + '</strong></div>' +
        '<div class="stat">Assigned: <strong>' + counts.assigned + '</strong></div>' +
        '<div class="stat">Resolved: <strong>' + counts.resolved + '</strong></div>' +
        '<div class="stat" style="color:#b3261e;">Reopened: <strong>' + counts.reopened + '</strong></div>' +
        '<div class="stat" style="color:#b3261e;">Emergency: <strong>' + counts.emergency + '</strong></div>';

      var activeCount = 0, solvedCount = 0;
      for (var k = 0; k < allComplaints.length; k++) {
        if (isActiveComplaint(allComplaints[k])) activeCount++;
        if (isSolvedComplaint(allComplaints[k])) solvedCount++;
      }
      countActiveEl.textContent = activeCount;
      countSolvedEl.textContent = solvedCount;
    }

    function renderCard(c) {
      var div = document.createElement('div');
      div.className = 'card priority-' + c.priority + ' status-' + c.status;

      var attributionHtml = '';
      if (c.assigned_by_warden || c.assigned_to || c.resolved_by_warden || c.worker_rating) {
        attributionHtml = '<div class="attribution">';
        if (c.assigned_to) {
          attributionHtml += '🔧 <strong>Worker:</strong> ' + escapeHtml(c.assigned_to);
          if (c.assigned_by_warden) {
            attributionHtml += ' · Assigned by <strong>' + escapeHtml(c.assigned_by_warden) + '</strong>';
          }
          if (c.assigned_at) {
            attributionHtml += ' (' + timeAgo(c.assigned_at) + ')';
          }
        } else {
          attributionHtml += '⏳ Not yet assigned';
        }
        if (c.resolved_by_warden) {
          attributionHtml += '<br>✅ <strong>Resolved by:</strong> ' + escapeHtml(c.resolved_by_warden);
          if (c.resolved_at) attributionHtml += ' · ' + formatDate(c.resolved_at);
        }
        if (c.worker_rating) {
          attributionHtml += '<span class="rated-badge">⭐ ' + c.worker_rating + '/5</span>';
          if (c.worker_comment) {
            attributionHtml += '<div style="margin-top:6px; font-style:italic;">💬 "' + escapeHtml(c.worker_comment) + '"</div>';
          }
        }
        attributionHtml += '</div>';
      }

      var buttonsHtml = '';
      if (c.status === 'PENDING') {
        buttonsHtml =
          '<button class="assign" data-action="ASSIGN">Assign to Staff</button>' +
          '<button class="reject" data-action="REJECTED">Reject</button>';
      } else if (c.status === 'ASSIGNED' || c.status === 'REOPENED') {
        buttonsHtml =
          '<button class="change-staff" data-action="CHANGE_STAFF">Change Staff</button>' +
          '<button class="resolve" data-action="RESOLVED">Resolve</button>' +
          '<button class="reject" data-action="REJECTED">Reject</button>';
      } else if (c.status === 'RESOLVED') {
        buttonsHtml =
          '<button class="reopen" data-action="REOPENED">Reopen</button>' +
          '<button data-action="CLOSED">Close</button>';
      } else {
        buttonsHtml =
          '<button class="reopen" data-action="REOPENED">Reopen</button>';
      }

      div.innerHTML = '' +
        '<div class="card-top">' +
          '<div>' +
            '<div class="card-title">' + escapeHtml(complaintCode(c)) + '</div>' +
            '<div class="card-subtitle">Room ' + escapeHtml(c.room_number) + ' · ' + escapeHtml(c.subcategory) + '</div>' +
            '<div class="meta" style="margin-top:8px;">' +
              '<strong>' + escapeHtml(c.student_name) + '</strong> (' + escapeHtml(c.student_roll) + ') · ' + escapeHtml(c.hostel) + '<br>' +
              'Category: ' + escapeHtml(c.category) + ' · Submitted: ' + formatDate(c.created_at) + ' (' + timeAgo(c.created_at) + ')' +
              (c.description ? '<br>Note: ' + escapeHtml(c.description) : '') +
              (c.feedback ? '<br><strong>Feedback:</strong> ' + escapeHtml(c.feedback) : '') +
              (c.reopen_count > 0 ? '<br><span style="color:#b3261e;">⚠ Reopened ' + c.reopen_count + ' time(s)</span>' : '') +
            '</div>' +
          '</div>' +
          '<div class="badges">' +
            (c.priority === 'EMERGENCY' ? '<span class="badge EMERGENCY">Emergency</span>' : '') +
            '<span class="badge ' + c.status + '">' + c.status + '</span>' +
          '</div>' +
        '</div>' +
        attributionHtml +
        '<div class="actions">' + buttonsHtml + '</div>';

      var actionButtons = div.querySelectorAll('button[data-action]');
      for (var i = 0; i < actionButtons.length; i++) {
        (function(btn) {
          btn.addEventListener('click', function() {
            var action = btn.getAttribute('data-action');
            if (action === 'ASSIGN') openAssignModal(c.id, null);
            else if (action === 'CHANGE_STAFF') openAssignModal(c.id, c.assigned_to || '');
            else if (action === 'RESOLVED') updateComplaint(c.id, 'RESOLVED');
            else if (action === 'CLOSED') updateComplaint(c.id, 'CLOSED');
            else if (action === 'REOPENED') updateComplaint(c.id, 'REOPENED');
            else if (action === 'REJECTED') {
              var reason = prompt('Reason for rejection (will be shown to student):');
              if (reason === null) return;
              updateComplaint(c.id, 'REJECTED', reason);
            }
          });
        })(actionButtons[i]);
      }

      return div;
    }

    function render() {
      var filterStatus = filterStatusEl.value;
      var filterHostel = filterHostelEl.value.trim().toLowerCase();
      var search = searchInputEl.value.trim().toLowerCase();

      var filtered = [];
      for (var i = 0; i < allComplaints.length; i++) {
        var c = allComplaints[i];
        if (currentSubTab === 'active' && !isActiveComplaint(c)) continue;
        if (currentSubTab === 'solved' && !isSolvedComplaint(c)) continue;
        if (filterStatus && c.status !== filterStatus) continue;
        if (filterHostel && String(c.hostel || '').toLowerCase().indexOf(filterHostel) === -1) continue;

        if (search) {
          var haystack = [
            String(c.id),
            c.complaint_code || '',
            c.room_number,
            c.student_name,
            c.student_roll,
            c.hostel,
            c.category,
            c.subcategory,
            c.description || '',
            c.assigned_to || '',
            c.assigned_by_warden || '',
            c.resolved_by_warden || ''
          ].join(' ').toLowerCase();
          if (haystack.indexOf(search) === -1) continue;
        }
        filtered.push(c);
      }

      listEl.innerHTML = '';
      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty">No complaints match your filters.</div>';
      } else {
        for (var j = 0; j < filtered.length; j++) {
          listEl.appendChild(renderCard(filtered[j]));
        }
      }
      renderStats();
    }

    async function loadComplaints() {
      try {
        var res = await fetch('/api/complaints');
        if (res.status === 401) {
          window.location.href = 'login.html';
          return;
        }
        if (!res.ok) throw new Error('Failed to load');
        allComplaints = await res.json();
        lastUpdatedEl.textContent = 'Updated: ' + new Date().toLocaleTimeString();
        render();
      } catch (err) {
        listEl.innerHTML = '<div class="empty">Cannot reach server. Is the backend running?</div>';
      }
    }

    async function updateComplaint(id, status, feedback) {
      try {
        var body = { status: status };
        if (feedback !== undefined) body.feedback = feedback;

        var res = await fetch('/api/complaints/' + id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (res.status === 401) {
          window.location.href = 'login.html';
          return;
        }
        var data = await res.json();
        if (!res.ok) {
          alert(data.error || 'Could not update complaint.');
          return;
        }
        await loadComplaints();
      } catch (err) {
        alert('Could not update complaint. Check server.');
      }
    }

    function openAssignModal(complaintId, currentStaff) {
      var isReassign = !!currentStaff;

      var overlay = document.createElement('div');
      overlay.className = 'modal-overlay';

      var headingText = isReassign ? 'Change Staff' : 'Assign to Staff';
      var subtitleText = isReassign
        ? 'Enter the new staff name. Currently assigned to: ' + escapeHtml(currentStaff)
        : 'Enter the staff name who will fix this complaint.';
      var confirmText = isReassign ? 'Change' : 'Assign';

      overlay.innerHTML = '' +
        '<div class="modal-box">' +
          '<h3>' + headingText + '</h3>' +
          '<div class="modal-sub">' + subtitleText + '</div>' +
          '<input type="text" id="modalStaffInput" placeholder="e.g., Ramesh" autocomplete="off" />' +
          '<div class="modal-err" id="modalErr"></div>' +
          '<div class="modal-buttons">' +
            '<button id="modalCancel">Cancel</button>' +
            '<button class="primary" id="modalConfirm" disabled>' + confirmText + '</button>' +
          '</div>' +
        '</div>';

      document.body.appendChild(overlay);
      modalOpen = true;

      var input = overlay.querySelector('#modalStaffInput');
      var confirmBtn = overlay.querySelector('#modalConfirm');
      var cancelBtn = overlay.querySelector('#modalCancel');
      var errEl = overlay.querySelector('#modalErr');

      setTimeout(function() { input.focus(); }, 50);

      input.addEventListener('input', function() {
        confirmBtn.disabled = !input.value.trim();
      });
      input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && input.value.trim()) {
          confirmBtn.click();
        }
      });

      function closeModal() {
        overlay.remove();
        modalOpen = false;
      }

      cancelBtn.addEventListener('click', closeModal);
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeModal();
      });

      confirmBtn.addEventListener('click', async function() {
        var staff_name = input.value.trim();
        if (!staff_name) return;

        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Saving...';
        errEl.style.display = 'none';

        try {
          var res = await fetch('/api/complaints/' + complaintId + '/assign', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ staff_name: staff_name })
          });
          var data = await res.json();

          if (!res.ok) {
            errEl.textContent = data.error || 'Failed to assign.';
            errEl.style.display = 'block';
            confirmBtn.disabled = false;
            confirmBtn.textContent = confirmText;
            return;
          }

          closeModal();
          await loadComplaints();
        } catch (err) {
          errEl.textContent = 'Cannot reach server.';
          errEl.style.display = 'block';
          confirmBtn.disabled = false;
          confirmBtn.textContent = confirmText;
        }
      });
    }

    async function loadWorkers() {
      workerListEl.innerHTML = '<div class="loading">Loading worker performance...</div>';
      try {
        var res = await fetch('/api/workers/performance');
        if (res.status === 401) {
          window.location.href = 'login.html';
          return;
        }
        if (!res.ok) throw new Error();
        var workers = await res.json();

        if (!workers || workers.length === 0) {
          workerListEl.innerHTML = '<div class="empty">No workers assigned yet. Assign complaints to see performance here.</div>';
          return;
        }

        workerListEl.innerHTML = '';
        for (var i = 0; i < workers.length; i++) {
          var w = workers[i];
          var div = document.createElement('div');
          div.className = 'worker-card';
          var avg = w.avg_rating ? Number(w.avg_rating) : null;
          var starsShown = avg ? '★'.repeat(Math.round(avg)) + '☆'.repeat(5 - Math.round(avg)) : '—';
          div.innerHTML = '' +
            '<div class="worker-name">👷 ' + escapeHtml(w.worker_name) + '</div>' +
            '<div class="worker-stats">' +
              '<span class="worker-stars">' + starsShown + '</span>' +
              '<span>' + (avg ? avg.toFixed(2) + ' / 5' : 'No ratings') + '</span>' +
              '<span><strong>' + w.total_jobs + '</strong> total jobs</span>' +
              '<span><strong>' + w.completed_jobs + '</strong> completed</span>' +
              '<span><strong>' + w.rated_jobs + '</strong> rated</span>' +
            '</div>';
          workerListEl.appendChild(div);
        }
      } catch (err) {
        workerListEl.innerHTML = '<div class="empty">Could not load worker performance.</div>';
      }
    }

    function printTaskList() {
      var active = [];
      for (var i = 0; i < allComplaints.length; i++) {
        var c = allComplaints[i];
        if (c.status === 'PENDING' || c.status === 'ASSIGNED' || c.status === 'REOPENED') {
          active.push(c);
        }
      }

      if (active.length === 0) {
        alert('No active tasks to print.');
        return;
      }

      var today = new Date().toLocaleDateString();
      var hostel = currentUser.hostel || 'All Hostels';

      var html = '<div style="font-family: Arial, sans-serif; max-width: 800px; margin: auto;">' +
        '<h1 style="color:#0d3b66; margin-bottom: 4px;">Hostel Fix — Task List</h1>' +
        '<p style="color:#666; margin-bottom: 20px;"><strong>' + escapeHtml(hostel) + '</strong> · ' + today + '</p>' +
        '<table style="width:100%; border-collapse:collapse; font-size:14px;">' +
          '<thead>' +
            '<tr style="background:#f4f6f8; border-bottom:2px solid #333;">' +
              '<th style="text-align:left; padding:8px;">Done</th>' +
              '<th style="text-align:left; padding:8px;">Code</th>' +
              '<th style="text-align:left; padding:8px;">Room</th>' +
              '<th style="text-align:left; padding:8px;">Problem</th>' +
              '<th style="text-align:left; padding:8px;">Assigned To</th>' +
            '</tr>' +
          '</thead>' +
          '<tbody>';

      for (var j = 0; j < active.length; j++) {
        var c2 = active[j];
        html += '<tr style="border-bottom:1px solid #ddd;">' +
          '<td style="padding:10px;"><span style="display:inline-block; width:16px; height:16px; border:2px solid #333; border-radius:3px;"></span></td>' +
          '<td style="padding:10px; font-family:monospace;">' + escapeHtml(complaintCode(c2)) + '</td>' +
          '<td style="padding:10px;">' + escapeHtml(c2.room_number) + '</td>' +
          '<td style="padding:10px;">' + escapeHtml(c2.subcategory) + (c2.priority === 'EMERGENCY' ? ' ⚠ EMERGENCY' : '') + '</td>' +
          '<td style="padding:10px;">' + escapeHtml(c2.assigned_to || '—') + '</td>' +
        '</tr>';
      }

      html += '</tbody></table>' +
        '<p style="margin-top: 24px; font-size: 12px; color:#888;">Total active tasks: ' + active.length + ' · Printed ' + new Date().toLocaleString() + '</p>' +
        '</div>';

      printArea.innerHTML = html;
      printArea.classList.remove('hidden');
      window.print();
      setTimeout(function() { printArea.classList.add('hidden'); }, 500);
    }

    function exportCsv() {
      window.location.href = '/api/complaints/export.csv';
    }

    filterStatusEl.addEventListener('change', render);
    filterHostelEl.addEventListener('input', render);
    searchInputEl.addEventListener('input', render);
    clearSearchBtn.addEventListener('click', function() {
      searchInputEl.value = '';
      render();
      searchInputEl.focus();
    });
    refreshBtn.addEventListener('click', loadComplaints);
    printTaskListBtn.addEventListener('click', printTaskList);
    exportCsvBtn.addEventListener('click', exportCsv);

    function startAutoRefresh() {
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      autoRefreshTimer = setInterval(function() {
        if (!modalOpen) {
          loadComplaints();
        }
      }, 15000);
    }

    (async function() {
      var ok = await checkAuth();
      if (ok) {
        loadComplaints();
        startAutoRefresh();
      }
    })();
  </script>
</body>
</html>
