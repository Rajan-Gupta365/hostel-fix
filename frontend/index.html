<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hostel Fix — Home</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0d3b66 0%, #1a4fa0 100%);
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 520px;
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      padding: 36px 28px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.2);
      text-align: center;
    }
    .logo { font-size: 44px; margin-bottom: 6px; }
    h1 {
      font-size: 28px;
      color: #0d3b66;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 15px;
      color: #666;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      text-align: left;
      margin: 18px 0 8px;
    }
    .section-title:first-of-type { margin-top: 0; }
    .buttons {
      display: grid;
      gap: 10px;
      margin-bottom: 10px;
    }
    .btn {
      display: block;
      text-decoration: none;
      padding: 16px 18px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      transition: transform 0.15s, box-shadow 0.15s;
      text-align: left;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    }
    .btn .btn-title { display: block; margin-bottom: 4px; }
    .btn .btn-desc {
      display: block;
      font-size: 12px;
      font-weight: 400;
      opacity: 0.85;
    }
    .btn-primary {
      background: #0d3b66;
      color: #ffffff;
    }
    .btn-secondary {
      background: #e8f0fe;
      color: #0d3b66;
    }
    .btn-staff {
      background: #f4f6f8;
      color: #0d3b66;
      border: 2px solid #d0d7de;
    }
    .divider {
      height: 1px;
      background: #e0e4e8;
      margin: 20px 0 8px;
    }
    .footer {
      margin-top: 22px;
      font-size: 12px;
      color: #999;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🏠</div>
    <h1>Hostel Fix</h1>
    <p class="subtitle">Report and track hostel problems quickly and easily.</p>

    <div class="section-title">For Students</div>
    <div class="buttons">
      <a href="student-login.html" class="btn btn-primary">
        <span class="btn-title">🔑 Log In</span>
        <span class="btn-desc">Already registered? Log in to report or track</span>
      </a>
      <a href="signup.html" class="btn btn-secondary">
        <span class="btn-title">📝 Sign Up</span>
        <span class="btn-desc">New here? Create your account in 1 minute</span>
      </a>
    </div>

    <div class="divider"></div>

    <div class="section-title">For Wardens &amp; Admins</div>
    <div class="buttons">
      <a href="login.html" class="btn btn-staff">
        <span class="btn-title">🛠️ Warden / Admin Login</span>
        <span class="btn-desc">Manage complaints, assign, resolve</span>
      </a>
    </div>

    <div class="footer">
      Hostel Fix · Pilot version
    </div>
  </div>
</body>
</html>
