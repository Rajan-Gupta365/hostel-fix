<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hostel Fix — Change Password</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      color: #1a1a1a;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 460px;
      margin: 40px auto 0;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 22px;
      color: #0d3b66;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 22px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      margin-top: 14px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccd3da;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      background: #fafbfc;
    }
    input:focus {
      outline: none;
      border-color: #0d3b66;
      background: #ffffff;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      background: #0d3b66;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover { background: #092a4a; }
    button:disabled { background: #8899aa; cursor: not-allowed; }
    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .message.success { background: #e6f4ea; color: #1e7e34; display: block; }
    .message.error   { background: #fdecea; color: #b3261e; display: block; }
    .link-row {
      display: flex;
      justify-content: space-between;
      margin-top: 18px;
      font-size: 13px;
    }
    .link-row a {
      color: #0d3b66;
      text-decoration: none;
    }
    .link-row a:hover { text-decoration: underline; }
    .user-info {
      background: #f4f6f8;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: #555;
      margin-bottom: 12px;
    }
    .user-info strong { color: #0d3b66; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Change Password</h1>
      <p class="subtitle">Update your login password. Minimum 8 characters.</p>

      <div class="user-info hidden" id="userInfo"></div>

      <form id="pwdForm">
        <label for="current_password">Current Password</label>
        <input type="password" id="current_password" required autocomplete="current-password" />

        <label for="new_password">New Password (min 8 chars)</label>
        <input type="password" id="new_password" required autocomplete="new-password" />

        <label for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" required autocomplete="new-password" />

        <button type="submit" id="submitBtn">Change Password</button>

        <div id="message" class="message"></div>
      </form>

      <div class="link-row">
        <a href="warden.html">← Back to Dashboard</a>
        <a href="index.html">Home</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('pwdForm');
    const submitBtn = document.getElementById('submitBtn');
    const messageBox = document.getElementById('message');
    const userInfoBox = document.getElementById('userInfo');

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = 'message ' + type;
    }

    // Check login status first
    (async () => {
      try {
        const res = await fetch('/api/auth/me');
        if (res.status === 401) {
          window.location.href = 'login.html';
          return;
        }
        const data = await res.json();
        userInfoBox.innerHTML = 'Logged in as <strong>' +
          escapeHtml(data.user.full_name || data.user.username) +
          '</strong> (' + data.user.role +
          (data.user.hostel ? ' — ' + escapeHtml(data.user.hostel) : '') + ')';
        userInfoBox.classList.remove('hidden');
      } catch (err) {
        window.location.href = 'login.html';
      }
    })();

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageBox.className = 'message';

      const currentPwd = document.getElementById('current_password').value;
      const newPwd = document.getElementById('new_password').value;
      const confirmPwd = document.getElementById('confirm_password').value;

      if (newPwd.length < 8) {
        showMessage('New password must be at least 8 characters.', 'error');
        return;
      }
      if (newPwd !== confirmPwd) {
        showMessage('New passwords do not match.', 'error');
        return;
      }
      if (newPwd === currentPwd) {
        showMessage('New password must be different from current.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Changing...';

      try {
        const res = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            current_password: currentPwd,
            new_password: newPwd
          })
        });

        const data = await res.json();

        if (!res.ok) {
          showMessage(data.error || 'Failed to change password.', 'error');
        } else {
          showMessage('✅ Password changed successfully! Redirecting to dashboard...', 'success');
          form.reset();
          setTimeout(() => {
            window.location.href = 'warden.html';
          }, 1500);
        }
      } catch (err) {
        showMessage('Cannot reach server. Is the backend running?', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Change Password';
      }
    });
  </script>
</body>
</html>
