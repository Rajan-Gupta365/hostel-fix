<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hostel Fix — My Complaints</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      color: #1a1a1a;
      padding: 20px;
      min-height: 100vh;
    }
    .container { max-width: 720px; margin: 0 auto; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 { font-size: 22px; color: #0d3b66; }
    .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav-links a, .nav-links button {
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
    }
    .nav-links a { background: #e8f0fe; color: #0d3b66; }
    .nav-links a:hover { background: #d3e2fb; }
    .nav-links button.logout { background: #b3261e; color: #ffffff; }
    .nav-links button.logout:hover { background: #8a1c16; }

    .welcome-box {
      background: #f4f8ff;
      border: 1px solid #d6e4f7;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #1a4fa0;
      line-height: 1.5;
    }
    .welcome-box strong { color: #0d3b66; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid #e0e4e8;
      margin-bottom: 16px;
    }
    .tab {
      padding: 10px 18px;
      border: none;
      background: none;
      font-size: 14px;
      font-weight: 600;
      color: #666;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      font-family: inherit;
    }
    .tab.active { color: #0d3b66; border-bottom-color: #0d3b66; }

    .results { display: grid; gap: 12px; }
    .card {
      background: #ffffff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      border-left: 5px solid #8899aa;
    }
    .card.status-PENDING      { border-left-color: #f0ad00; }
    .card.status-ASSIGNED     { border-left-color: #1976d2; }
    .card.status-RESOLVED     { border-left-color: #1e7e34; }
    .card.status-CLOSED       { border-left-color: #555; opacity: 0.85; }
    .card.status-REOPENED     { border-left-color: #b3261e; }
    .card.status-REJECTED     { border-left-color: #b3261e; opacity: 0.85; }
    .card.priority-EMERGENCY {
      box-shadow: 0 0 0 2px #fdecea, 0 1px 6px rgba(0,0,0,0.06);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #0d3b66;
      font-family: monospace;
    }
    .card-subtitle {
      font-size: 14px;
      color: #333;
      font-weight: 600;
      margin-top: 2px;
    }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      background: #eef1f5;
      color: #333;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .badge.EMERGENCY  { background: #fdecea; color: #b3261e; }
    .badge.PENDING    { background: #fff4d6; color: #8a6300; }
    .badge.ASSIGNED   { background: #e3f0ff; color: #1a4fa0; }
    .badge.RESOLVED   { background: #e6f4ea; color: #1e7e34; }
    .badge.CLOSED     { background: #e8eaed; color: #555; }
    .badge.REOPENED   { background: #fdecea; color: #b3261e; }
    .badge.REJECTED   { background: #fdecea; color: #b3261e; }
    .meta { font-size: 13px; color: #555; line-height: 1.6; }
    .meta strong { color: #333; }

    .attribution {
      background: #f8fafc;
      border-left: 3px solid #cbd5e1;
      padding: 8px 12px;
      margin-top: 10px;
      border-radius: 6px;
      font-size: 12.5px;
      color: #475569;
      line-height: 1.6;
    }
    .attribution strong { color: #334155; }

    .rate-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed #e0e4e8;
    }
    .rate-title {
      font-size: 14px;
      font-weight: 700;
      color: #0d3b66;
      margin-bottom: 4px;
    }
    .rate-sub {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
    }
    .stars {
      display: flex;
      gap: 6px;
      font-size: 30px;
      line-height: 1;
      margin-bottom: 10px;
      cursor: pointer;
      user-select: none;
    }
    .star {
      color: #d1d5db;
      transition: color 0.1s, transform 0.1s;
    }
    .star:hover { transform: scale(1.15); }
    .star.filled { color: #f5b301; }
    textarea.rate-comment {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccd3da;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      min-height: 60px;
      background: #fafbfc;
    }
    textarea.rate-comment:focus {
      outline: none;
      border-color: #0d3b66;
      background: #ffffff;
    }
    .rate-buttons {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .rate-buttons button {
      padding: 9px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #ccd3da;
      background: #ffffff;
      font-family: inherit;
    }
    .rate-buttons button.submit {
      background: #0d3b66;
      color: white;
      border-color: #0d3b66;
    }
    .rate-buttons button.submit:hover { background: #092a4a; }
    .rate-buttons button.submit:disabled { background: #8899aa; cursor: not-allowed; }
    .rate-buttons button.skip:hover { background: #f0f3f7; }

    .rated-display {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 10px 14px;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 13px;
      color: #166534;
      line-height: 1.6;
    }
    .rated-display .stars-shown {
      font-size: 18px;
      color: #f5b301;
      letter-spacing: 2px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed #e0e4e8;
      flex-wrap: wrap;
    }
    .actions button {
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #ccd3da;
      background: #ffffff;
      font-family: inherit;
    }
    .actions button.confirm { background: #1e7e34; color: white; border-color: #1e7e34; }
    .actions button.reopen  { background: #b3261e; color: white; border-color: #b3261e; }
    .actions button:hover { opacity: 0.9; }

    .empty {
      text-align: center;
      padding: 40px 24px;
      color: #666;
      background: #ffffff;
      border-radius: 10px;
      font-size: 14px;
    }
    .empty .icon { font-size: 40px; margin-bottom: 10px; display: block; }
    .empty a {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 20px;
      background: #0d3b66;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    .empty a:hover { background: #092a4a; }
    .loading { text-align: center; padding: 40px; color: #666; font-size: 14px; }
    .error {
      padding: 14px;
      background: #fdecea;
      color: #b3261e;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
    }
    .hidden { display: none !important; }

    .auto-close-note {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="topbar">
      <h1>My Complaints</h1>
      <div class="nav-links">
        <a href="student.html">+ New Complaint</a>
        <a href="change-password.html">Change Password</a>
        <button class="logout" id="logoutBtn">Logout</button>
      </div>
    </div>

    <div class="welcome-box hidden" id="welcomeBox"></div>

    <div class="auto-close-note" id="autoCloseNote"></div>

    <div class="tabs">
      <button class="tab active" data-tab="active" id="tabActive">🔴 Active (<span id="countActive">0</span>)</button>
      <button class="tab" data-tab="solved" id="tabSolved">✅ Solved (<span id="countSolved">0</span>)</button>
    </div>

    <div class="results" id="results">
      <div class="loading">Loading your complaints...</div>
    </div>
  </div>

  <script>
    const resultsEl = document.getElementById('results');
    const welcomeBox = document.getElementById('welcomeBox');
    const logoutBtn = document.getElementById('logoutBtn');
    const countActiveEl = document.getElementById('countActive');
    const countSolvedEl = document.getElementById('countSolved');
    const autoCloseNote = document.getElementById('autoCloseNote');

    let currentUser = null;
    let allComplaints = [];
    let currentTab = 'active'; // 'active' | 'solved'
    const draftRatings = {};

    // Active vs Solved classification for STUDENTS
    // RESOLVED goes to Active (student still needs to confirm + rate)
    const ACTIVE_STATUSES = ['PENDING', 'ASSIGNED', 'REOPENED', 'RESOLVED'];
    const SOLVED_STATUSES = ['CLOSED', 'REJECTED'];

    function isActive(c) { return ACTIVE_STATUSES.includes(c.status); }
    function isSolved(c) { return SOLVED_STATUSES.includes(c.status); }

    // Tabs
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentTab = tab.dataset.tab;
        render();
      });
    });

    function formatDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString();
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function starsDisplay(rating) {
      let s = '';
      for (let i = 1; i <= 5; i++) {
        s += i <= rating ? '★' : '☆';
      }
      return s;
    }

    function updateTabCounts() {
      const a = allComplaints.filter(isActive).length;
      const s = allComplaints.filter(isSolved).length;
      countActiveEl.textContent = a;
      countSolvedEl.textContent = s;
    }

    function renderCard(c) {
      const div = document.createElement('div');
      div.className = `card status-${c.status} priority-${c.priority}`;

      const canConfirm = c.status === 'RESOLVED';
      const canReopen  = c.status === 'RESOLVED' || c.status === 'CLOSED';
      const canRate    = (c.status === 'RESOLVED' || c.status === 'CLOSED')
                         && c.assigned_to
                         && !c.worker_rating;
      const hasRating  = !!c.worker_rating;

      let attributionHtml = '';
      if (c.assigned_to || c.assigned_by_warden || c.resolved_by_warden) {
        attributionHtml = '<div class="attribution">';
        if (c.assigned_to) {
          attributionHtml += '🔧 <strong>Worker:</strong> ' + escapeHtml(c.assigned_to);
          if (c.assigned_by_warden) {
            attributionHtml += ' · Assigned by <strong>' + escapeHtml(c.assigned_by_warden) + '</strong>';
          }
        } else {
          attributionHtml += '⏳ Not yet assigned to a worker';
        }
        if (c.resolved_by_warden) {
          attributionHtml += '<br>✅ <strong>Resolved by:</strong> ' + escapeHtml(c.resolved_by_warden);
          if (c.resolved_at) attributionHtml += ' · ' + formatDate(c.resolved_at);
        }
        attributionHtml += '</div>';
      }

      div.innerHTML = `
        <div class="card-top">
          <div>
            <div class="card-title">${escapeHtml(c.complaint_code || ('HF-' + String(c.id).padStart(4, '0')))}</div>
            <div class="card-subtitle">${escapeHtml(c.subcategory)}</div>
            <div class="meta" style="margin-top:8px;">
              Room <strong>${escapeHtml(c.room_number)}</strong>, ${escapeHtml(c.hostel)}<br>
              Category: ${escapeHtml(c.category)}<br>
              Submitted: ${formatDate(c.created_at)}
              ${c.description ? '<br>Note: ' + escapeHtml(c.description) : ''}
              ${c.feedback ? '<br><strong>Feedback:</strong> ' + escapeHtml(c.feedback) : ''}
            </div>
          </div>
          <div class="badges">
            ${c.priority === 'EMERGENCY' ? '<span class="badge EMERGENCY">Emergency</span>' : ''}
            <span class="badge ${c.status}">${c.status}</span>
          </div>
        </div>

        ${attributionHtml}

        ${hasRating ? `
          <div class="rated-display">
            ✅ You rated <strong>${escapeHtml(c.assigned_to)}</strong>:
            <span class="stars-shown">${starsDisplay(c.worker_rating)}</span>
            (${c.worker_rating}/5)
            ${c.worker_comment ? '<br>💬 <em>' + escapeHtml(c.worker_comment) + '</em>' : ''}
          </div>
        ` : ''}

        ${canRate ? `
          <div class="rate-section" data-complaint-id="${c.id}">
            <div class="rate-title">How was ${escapeHtml(c.assigned_to)}'s work?</div>
            <div class="rate-sub">Your feedback helps improve service. Optional.</div>
            <div class="stars" data-complaint-id="${c.id}">
              ${[1,2,3,4,5].map(n => `<span class="star" data-value="${n}">★</span>`).join('')}
            </div>
            <textarea class="rate-comment" placeholder="Add a comment (optional)" maxlength="300"></textarea>
            <div class="rate-buttons">
              <button class="submit" data-action="RATE_SUBMIT" data-id="${c.id}" disabled>Submit Rating</button>
              <button class="skip" data-action="RATE_SKIP" data-id="${c.id}">Skip</button>
            </div>
          </div>
        ` : ''}

        ${(canConfirm || canReopen) ? `
        <div class="actions">
          ${canConfirm ? '<button class="confirm" data-action="CONFIRM" data-id="' + c.id + '">✅ It\'s fixed</button>' : ''}
          ${canReopen ? '<button class="reopen" data-action="REOPEN" data-id="' + c.id + '">❌ Not fixed — Reopen</button>' : ''}
        </div>` : ''}
      `;

      const starsEl = div.querySelector('.stars');
      if (starsEl) {
        const stars = starsEl.querySelectorAll('.star');
        stars.forEach(star => {
          star.addEventListener('mouseenter', () => {
            const val = Number(star.dataset.value);
            stars.forEach(s => s.classList.toggle('filled', Number(s.dataset.value) <= val));
          });
          star.addEventListener('mouseleave', () => {
            const cur = draftRatings[c.id] || 0;
            stars.forEach(s => s.classList.toggle('filled', Number(s.dataset.value) <= cur));
          });
          star.addEventListener('click', () => {
            const val = Number(star.dataset.value);
            draftRatings[c.id] = val;
            stars.forEach(s => s.classList.toggle('filled', Number(s.dataset.value) <= val));
            const submitBtn = div.querySelector('button[data-action="RATE_SUBMIT"]');
            if (submitBtn) submitBtn.disabled = false;
          });
        });
      }

      div.querySelectorAll('button[data-action]').forEach(btn => {
        btn.addEventListener('click', () => {
          const action = btn.dataset.action;
          const id = btn.dataset.id;
          if (action === 'CONFIRM') return studentConfirm(id);
          if (action === 'REOPEN')  return studentReopen(id);
          if (action === 'RATE_SKIP') {
            const section = div.querySelector('.rate-section');
            if (section) section.remove();
            return;
          }
          if (action === 'RATE_SUBMIT') {
            const commentEl = div.querySelector('.rate-comment');
            const comment = commentEl ? commentEl.value.trim() : '';
            const rating = draftRatings[id];
            if (!rating) return;
            return submitRating(id, rating, comment, btn);
          }
        });
      });

      return div;
    }

    function renderEmpty(tab) {
      if (tab === 'active') {
        resultsEl.innerHTML = `
          <div class="empty">
            <span class="icon">📭</span>
            <div>You have no active complaints.</div>
            <a href="student.html">Report a Problem →</a>
          </div>
        `;
      } else {
        resultsEl.innerHTML = `
          <div class="empty">
            <span class="icon">📚</span>
            <div>No solved complaints yet.</div>
          </div>
        `;
      }
    }

    function render() {
      updateTabCounts();

      const filtered = currentTab === 'active'
        ? allComplaints.filter(isActive)
        : allComplaints.filter(isSolved);

      if (!filtered || filtered.length === 0) {
        renderEmpty(currentTab);
      } else {
        resultsEl.innerHTML = '';
        filtered.forEach(c => resultsEl.appendChild(renderCard(c)));
      }
    }

    async function loadMyComplaints() {
      resultsEl.innerHTML = '<div class="loading">Loading your complaints...</div>';
      try {
        const res = await fetch('/api/student/my-complaints');
        if (res.status === 401) {
          window.location.href = 'student-login.html';
          return;
        }
        if (!res.ok) throw new Error();
        allComplaints = await res.json();
        render();
      } catch (err) {
        resultsEl.innerHTML = '<div class="error">Could not load your complaints. Try refreshing.</div>';
      }
    }

    async function studentConfirm(id) {
      try {
        const res = await fetch('/api/complaints/' + id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'CLOSED', feedback: 'Student confirmed: fixed' })
        });
        if (!res.ok) throw new Error();
        await loadMyComplaints();
      } catch (err) {
        alert('Could not update. Try again.');
      }
    }

    async function studentReopen(id) {
      try {
        const res = await fetch('/api/complaints/' + id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'REOPENED', feedback: 'Student says: not fixed' })
        });
        if (!res.ok) throw new Error();
        await loadMyComplaints();
      } catch (err) {
        alert('Could not update. Try again.');
      }
    }

    async function submitRating(id, rating, comment, btn) {
      btn.disabled = true;
      btn.textContent = 'Submitting...';
      try {
        const res = await fetch('/api/complaints/' + id + '/rate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rating, comment })
        });
        const data = await res.json();
        if (!res.ok) {
          alert(data.error || 'Could not submit rating.');
          btn.disabled = false;
          btn.textContent = 'Submit Rating';
          return;
        }
        await loadMyComplaints();
      } catch (err) {
        alert('Could not submit rating.');
        btn.disabled = false;
        btn.textContent = 'Submit Rating';
      }
    }

    logoutBtn.addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = 'student-login.html';
    });

    // ---------- Auto-close old RESOLVED complaints ----------
    async function autoCloseOldOnLoad() {
      try {
        const res = await fetch('/api/complaints/auto-close-my', { method: 'POST' });
        if (!res.ok) return;
        const data = await res.json();
        if (data.closed > 0) {
          autoCloseNote.textContent = '📌 ' + data.closed +
            ' older resolved complaint(s) were auto-closed after 7 days. Check the Solved tab.';
          autoCloseNote.style.display = 'block';
        }
      } catch (err) {
        // Silent — not critical if it fails
      }
    }

    (async () => {
      try {
        const meRes = await fetch('/api/student/me');
        if (meRes.status === 401) {
          window.location.href = 'student-login.html';
          return;
        }
        const data = await meRes.json();
        currentUser = data.user;

        welcomeBox.innerHTML = '👋 <strong>' + escapeHtml(currentUser.full_name) +
          '</strong> — ' + escapeHtml(currentUser.roll_number) + ', ' +
          escapeHtml(currentUser.hostel) + ', Room ' +
          escapeHtml(currentUser.room_number);
        welcomeBox.classList.remove('hidden');

        // Auto-close old resolved, then load
        await autoCloseOldOnLoad();
        await loadMyComplaints();
      } catch (err) {
        window.location.href = 'student-login.html';
      }
    })();
  </script>
</body>
</html>
