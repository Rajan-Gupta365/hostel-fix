<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hostel Fix — My Complaints</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      color: #1a1a1a;
      padding: 20px;
      min-height: 100vh;
    }
    .container { max-width: 720px; margin: 0 auto; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 { font-size: 22px; color: #0d3b66; }
    .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
    .nav-links a, .nav-links button {
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
    }
    .nav-links a {
      background: #e8f0fe;
      color: #0d3b66;
    }
    .nav-links a:hover { background: #d3e2fb; }
    .nav-links button.logout {
      background: #b3261e;
      color: #ffffff;
    }
    .nav-links button.logout:hover { background: #8a1c16; }

    .welcome-box {
      background: #f4f8ff;
      border: 1px solid #d6e4f7;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #1a4fa0;
      line-height: 1.5;
    }
    .welcome-box strong { color: #0d3b66; }

    .results { display: grid; gap: 12px; }
    .card {
      background: #ffffff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      border-left: 5px solid #8899aa;
    }
    .card.status-PENDING      { border-left-color: #f0ad00; }
    .card.status-ASSIGNED     { border-left-color: #1976d2; }
    .card.status-IN_PROGRESS  { border-left-color: #1976d2; }
    .card.status-RESOLVED     { border-left-color: #1e7e34; }
    .card.status-CLOSED       { border-left-color: #555; opacity: 0.8; }
    .card.status-REOPENED     { border-left-color: #b3261e; }
    .card.status-REJECTED     { border-left-color: #b3261e; opacity: 0.85; }
    .card.priority-EMERGENCY {
      box-shadow: 0 0 0 2px #fdecea, 0 1px 6px rgba(0,0,0,0.06);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #0d3b66;
      font-family: monospace;
    }
    .card-subtitle {
      font-size: 14px;
      color: #333;
      font-weight: 600;
      margin-top: 2px;
    }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 999px;
      background: #eef1f5;
      color: #333;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .badge.EMERGENCY  { background: #fdecea; color: #b3261e; }
    .badge.PENDING    { background: #fff4d6; color: #8a6300; }
    .badge.ASSIGNED   { background: #e3f0ff; color: #1a4fa0; }
    .badge.IN_PROGRESS{ background: #e3f0ff; color: #1a4fa0; }
    .badge.RESOLVED   { background: #e6f4ea; color: #1e7e34; }
    .badge.CLOSED     { background: #e8eaed; color: #555; }
    .badge.REOPENED   { background: #fdecea; color: #b3261e; }
    .badge.REJECTED   { background: #fdecea; color: #b3261e; }
    .meta { font-size: 13px; color: #555; line-height: 1.6; }
    .meta strong { color: #333; }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed #e0e4e8;
      flex-wrap: wrap;
    }
    .actions button {
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #ccd3da;
      background: #ffffff;
      font-family: inherit;
    }
    .actions button.confirm { background: #1e7e34; color: white; border-color: #1e7e34; }
    .actions button.reopen  { background: #b3261e; color: white; border-color: #b3261e; }
    .actions button:hover { opacity: 0.9; }

    .empty {
      text-align: center;
      padding: 40px 24px;
      color: #666;
      background: #ffffff;
      border-radius: 10px;
      font-size: 14px;
    }
    .empty .icon { font-size: 40px; margin-bottom: 10px; display: block; }
    .empty a {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 20px;
      background: #0d3b66;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    .empty a:hover { background: #092a4a; }
    .loading { text-align: center; padding: 40px; color: #666; font-size: 14px; }
    .error {
      padding: 14px;
      background: #fdecea;
      color: #b3261e;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">

    <div class="topbar">
      <h1>My Complaints</h1>
      <div class="nav-links">
        <a href="student.html">+ New Complaint</a>
        <a href="change-password.html">Change Password</a>
        <button class="logout" id="logoutBtn">Logout</button>
      </div>
    </div>

    <div class="welcome-box hidden" id="welcomeBox"></div>

    <div class="results" id="results">
      <div class="loading">Loading your complaints...</div>
    </div>
  </div>

  <script>
    const resultsEl = document.getElementById('results');
    const welcomeBox = document.getElementById('welcomeBox');
    const logoutBtn = document.getElementById('logoutBtn');

    let currentUser = null;

    function formatDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString();
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderCard(c) {
      const div = document.createElement('div');
      div.className = `card status-${c.status} priority-${c.priority}`;

      const canConfirm = c.status === 'RESOLVED';
      const canReopen  = c.status === 'RESOLVED' || c.status === 'CLOSED';

      div.innerHTML = `
        <div class="card-top">
          <div>
            <div class="card-title">${escapeHtml(c.complaint_code || ('HF-' + String(c.id).padStart(4, '0')))}</div>
            <div class="card-subtitle">${escapeHtml(c.subcategory)}</div>
            <div class="meta" style="margin-top:8px;">
              Room <strong>${escapeHtml(c.room_number)}</strong>, ${escapeHtml(c.hostel)}<br>
              Category: ${escapeHtml(c.category)}<br>
              Submitted: ${formatDate(c.created_at)}
              ${c.assigned_to ? '<br>Assigned to: ' + escapeHtml(c.assigned_to) : ''}
              ${c.resolved_at ? '<br>Resolved: ' + formatDate(c.resolved_at) : ''}
              ${c.description ? '<br>Note: ' + escapeHtml(c.description) : ''}
              ${c.feedback ? '<br><strong>Feedback:</strong> ' + escapeHtml(c.feedback) : ''}
            </div>
          </div>
          <div class="badges">
            ${c.priority === 'EMERGENCY' ? '<span class="badge EMERGENCY">Emergency</span>' : ''}
            <span class="badge ${c.status}">${c.status}</span>
          </div>
        </div>
        ${(canConfirm || canReopen) ? `
        <div class="actions">
          ${canConfirm ? '<button class="confirm" data-action="CONFIRM" data-id="' + c.id + '">✅ It\'s fixed</button>' : ''}
          ${canReopen ? '<button class="reopen" data-action="REOPEN" data-id="' + c.id + '">❌ Not fixed — Reopen</button>' : ''}
        </div>` : ''}
      `;

      div.querySelectorAll('button[data-action]').forEach(btn => {
        btn.addEventListener('click', () => {
          const action = btn.getAttribute('data-action');
          const id = btn.getAttribute('data-id');
          if (action === 'CONFIRM') studentConfirm(id);
          if (action === 'REOPEN')  studentReopen(id);
        });
      });

      return div;
    }

    function renderEmpty() {
      resultsEl.innerHTML = `
        <div class="empty">
          <span class="icon">📭</span>
          <div>You haven't reported anything yet.</div>
          <a href="student.html">Report a Problem →</a>
        </div>
      `;
    }

    async function loadMyComplaints() {
      resultsEl.innerHTML = '<div class="loading">Loading your complaints...</div>';
      try {
        const res = await fetch('/api/student/my-complaints');
        if (res.status === 401) {
          window.location.href = 'student-login.html';
          return;
        }
        if (!res.ok) throw new Error();
        const list = await res.json();

        if (!list || list.length === 0) {
          renderEmpty();
        } else {
          resultsEl.innerHTML = '';
          list.forEach(c => resultsEl.appendChild(renderCard(c)));
        }
      } catch (err) {
        resultsEl.innerHTML = '<div class="error">Could not load your complaints. Try refreshing.</div>';
      }
    }

    async function studentConfirm(id) {
      try {
        const res = await fetch('/api/complaints/' + id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'CLOSED', feedback: 'Student confirmed: fixed' })
        });
        if (!res.ok) throw new Error();
        await loadMyComplaints();
      } catch (err) {
        alert('Could not update. Try again.');
      }
    }

    async function studentReopen(id) {
      try {
        const res = await fetch('/api/complaints/' + id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'REOPENED', feedback: 'Student says: not fixed' })
        });
        if (!res.ok) throw new Error();
        await loadMyComplaints();
      } catch (err) {
        alert('Could not update. Try again.');
      }
    }

    logoutBtn.addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = 'student-login.html';
    });

    // ---------- Init ----------
    (async () => {
      try {
        const meRes = await fetch('/api/student/me');
        if (meRes.status === 401) {
          window.location.href = 'student-login.html';
          return;
        }
        const data = await meRes.json();
        currentUser = data.user;

        welcomeBox.innerHTML = '👋 <strong>' + escapeHtml(currentUser.full_name) +
          '</strong> — ' + escapeHtml(currentUser.roll_number) + ', ' +
          escapeHtml(currentUser.hostel) + ', Room ' +
          escapeHtml(currentUser.room_number);
        welcomeBox.classList.remove('hidden');

        loadMyComplaints();
      } catch (err) {
        window.location.href = 'student-login.html';
      }
    })();
  </script>
</body>
</html>
