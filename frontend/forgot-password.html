<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hostel Fix — Forgot Password</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0d3b66 0%, #1a4fa0 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 460px;
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.2);
      margin-top: 20px;
    }
    .logo { font-size: 40px; text-align: center; margin-bottom: 6px; }
    h1 {
      font-size: 22px;
      color: #0d3b66;
      text-align: center;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-bottom: 22px;
      line-height: 1.5;
    }
    .step-indicator {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 22px;
      font-size: 12px;
      color: #999;
    }
    .step { display: flex; align-items: center; gap: 6px; }
    .step .dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #e0e4e8;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 11px;
    }
    .step.active .dot { background: #0d3b66; color: #ffffff; }
    .step.done .dot { background: #1e7e34; color: #ffffff; }
    .step.active { color: #0d3b66; font-weight: 700; }
    .step.done { color: #1e7e34; font-weight: 700; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      margin-top: 14px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ccd3da;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      background: #fafbfc;
    }
    input:focus {
      outline: none;
      border-color: #0d3b66;
      background: #ffffff;
    }
    input.otp {
      font-size: 22px;
      letter-spacing: 8px;
      text-align: center;
      font-family: monospace;
      font-weight: 700;
    }
    button.primary {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      background: #0d3b66;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    button.primary:hover { background: #092a4a; }
    button.primary:disabled { background: #8899aa; cursor: not-allowed; }
    button.link-btn {
      background: transparent;
      color: #0d3b66;
      text-decoration: underline;
      font-size: 13px;
      padding: 6px;
      margin-top: 10px;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .message {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      line-height: 1.5;
    }
    .message.success { background: #e6f4ea; color: #1e7e34; display: block; }
    .message.error   { background: #fdecea; color: #b3261e; display: block; }
    .message.info    { background: #e8f0fe; color: #1a4fa0; display: block; }
    .email-chip {
      display: inline-block;
      background: #f4f6f8;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
      color: #0d3b66;
      margin-top: 6px;
    }
    .links {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      font-size: 13px;
    }
    .links a { color: #0d3b66; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🔑</div>
    <h1>Forgot Password</h1>
    <p class="subtitle">Reset your password using the email you registered with.</p>

    <div class="step-indicator">
      <div class="step active" id="stepDot1">
        <span class="dot">1</span>
        <span>Email</span>
      </div>
      <div class="step" id="stepDot2">
        <span class="dot">2</span>
        <span>Verify</span>
      </div>
      <div class="step" id="stepDot3">
        <span class="dot">3</span>
        <span>New Password</span>
      </div>
    </div>

    <!-- STEP 1: Email -->
    <div id="step1">
      <label for="email">Your Registered Email</label>
      <input type="email" id="email" placeholder="e.g., abc@kiit.ac.in" autocomplete="email" />
      <button class="primary" id="sendBtn">Send Reset Code</button>
      <div class="message" id="msg1"></div>
    </div>

    <!-- STEP 2: OTP -->
    <div id="step2" class="hidden">
      <div class="message info">
        Code sent to <span class="email-chip" id="sentEmail"></span>
        <br><small>Didn't receive? Check spam, or <button class="link-btn" id="backToStep1Btn" style="margin:0;">change email</button></small>
      </div>

      <label for="code">6-Digit Reset Code</label>
      <input type="text" id="code" class="otp" maxlength="6" inputmode="numeric" placeholder="------" />

      <button class="primary" id="verifyBtn">Verify Code</button>
      <div class="message" id="msg2"></div>
    </div>

    <!-- STEP 3: New Password -->
    <div id="step3" class="hidden">
      <label for="new_password">New Password (min 8 chars)</label>
      <input type="password" id="new_password" autocomplete="new-password" placeholder="At least 8 characters" />

      <label for="confirm_password">Confirm New Password</label>
      <input type="password" id="confirm_password" autocomplete="new-password" placeholder="Re-enter password" />

      <button class="primary" id="resetBtn">Reset Password</button>
      <div class="message" id="msg3"></div>
    </div>

    <div class="links">
      <a href="student-login.html">Student Login</a>
      <a href="login.html">Warden Login</a>
      <a href="index.html">Home</a>
    </div>
  </div>

  <script>
    let pendingEmail = '';

    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const step3 = document.getElementById('step3');
    const stepDot1 = document.getElementById('stepDot1');
    const stepDot2 = document.getElementById('stepDot2');
    const stepDot3 = document.getElementById('stepDot3');

    const emailInput = document.getElementById('email');
    const codeInput = document.getElementById('code');
    const newPasswordInput = document.getElementById('new_password');
    const confirmPasswordInput = document.getElementById('confirm_password');

    const sendBtn = document.getElementById('sendBtn');
    const verifyBtn = document.getElementById('verifyBtn');
    const resetBtn = document.getElementById('resetBtn');
    const backToStep1Btn = document.getElementById('backToStep1Btn');

    const msg1 = document.getElementById('msg1');
    const msg2 = document.getElementById('msg2');
    const msg3 = document.getElementById('msg3');
    const sentEmail = document.getElementById('sentEmail');

    function showMsg(el, text, type) {
      el.innerHTML = text;
      el.className = 'message ' + type;
    }

    // ---------- STEP 1: Send reset code ----------
    sendBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim().toLowerCase();
      if (!email) {
        showMsg(msg1, 'Please enter your email address.', 'error');
        return;
      }

      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending...';
      msg1.className = 'message';

      try {
        const res = await fetch('/api/auth/request-reset-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (!res.ok) {
          showMsg(msg1, data.error || 'Could not send reset code.', 'error');
        } else {
          pendingEmail = email;
          sentEmail.textContent = email;
          step1.classList.add('hidden');
          step2.classList.remove('hidden');
          stepDot1.classList.remove('active');
          stepDot1.classList.add('done');
          stepDot2.classList.add('active');
          codeInput.focus();
        }
      } catch (err) {
        showMsg(msg1, 'Cannot reach server. Is the backend running?', 'error');
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send Reset Code';
      }
    });

    // ---------- STEP 2: Verify code ----------
    verifyBtn.addEventListener('click', async () => {
      const code = codeInput.value.trim();
      if (!code || code.length !== 6) {
        showMsg(msg2, 'Please enter the 6-digit code from your email.', 'error');
        return;
      }

      verifyBtn.disabled = true;
      verifyBtn.textContent = 'Verifying...';
      msg2.className = 'message';

      try {
        const res = await fetch('/api/auth/verify-reset-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: pendingEmail, code })
        });
        const data = await res.json();

        if (!res.ok) {
          showMsg(msg2, data.error || 'Invalid code.', 'error');
        } else {
          step2.classList.add('hidden');
          step3.classList.remove('hidden');
          stepDot2.classList.remove('active');
          stepDot2.classList.add('done');
          stepDot3.classList.add('active');
          newPasswordInput.focus();
        }
      } catch (err) {
        showMsg(msg2, 'Cannot reach server.', 'error');
      } finally {
        verifyBtn.disabled = false;
        verifyBtn.textContent = 'Verify Code';
      }
    });

    // ---------- STEP 3: Reset password ----------
    resetBtn.addEventListener('click', async () => {
      const newPwd = newPasswordInput.value;
      const confirmPwd = confirmPasswordInput.value;
      const code = codeInput.value.trim();

      msg3.className = 'message';

      if (newPwd.length < 8) {
        showMsg(msg3, 'Password must be at least 8 characters.', 'error');
        return;
      }
      if (newPwd !== confirmPwd) {
        showMsg(msg3, 'Passwords do not match.', 'error');
        return;
      }

      resetBtn.disabled = true;
      resetBtn.textContent = 'Resetting...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: pendingEmail,
            code,
            new_password: newPwd
          })
        });
        const data = await res.json();

        if (!res.ok) {
          showMsg(msg3, data.error || 'Could not reset password.', 'error');
        } else {
          showMsg(msg3, '✅ Password reset! Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = 'student-login.html';
          }, 1500);
        }
      } catch (err) {
        showMsg(msg3, 'Cannot reach server.', 'error');
      } finally {
        resetBtn.disabled = false;
        resetBtn.textContent = 'Reset Password';
      }
    });

    // Back to step 1
    backToStep1Btn.addEventListener('click', () => {
      step2.classList.add('hidden');
      step1.classList.remove('hidden');
      stepDot1.classList.remove('done');
      stepDot1.classList.add('active');
      stepDot2.classList.remove('active');
      msg2.className = 'message';
    });

    // Only digits in OTP
    codeInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });
  </script>
</body>
</html>
