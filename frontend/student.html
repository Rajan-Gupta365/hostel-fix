<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hostel Fix — Report a Problem</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      color: #1a1a1a;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    h1 {
      font-size: 22px;
      color: #0d3b66;
    }
    .nav-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .nav-links a, .nav-links button {
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
    }
    .nav-links a {
      background: #e8f0fe;
      color: #0d3b66;
    }
    .nav-links a:hover { background: #d3e2fb; }
    .nav-links button.logout {
      background: #b3261e;
      color: #ffffff;
    }
    .nav-links button.logout:hover { background: #8a1c16; }
    .welcome-box {
      background: #f4f8ff;
      border: 1px solid #d6e4f7;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #1a4fa0;
      line-height: 1.5;
    }
    .welcome-box strong { color: #0d3b66; }
    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      margin-top: 14px;
      color: #333;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccd3da;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      background: #fafbfc;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #0d3b66;
      background: #ffffff;
    }
    input[readonly] {
      background: #eef1f5;
      color: #555;
      cursor: not-allowed;
    }
    textarea {
      resize: vertical;
      min-height: 70px;
    }
    button.submit {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: #0d3b66;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    button.submit:hover { background: #092a4a; }
    button.submit:disabled { background: #8899aa; cursor: not-allowed; }
    .message {
      margin-top: 16px;
      padding: 14px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      line-height: 1.5;
    }
    .message.success { background: #e6f4ea; color: #1e7e34; display: block; }
    .message.error   { background: #fdecea; color: #b3261e; display: block; }
    .message.info    { background: #e8f0fe; color: #1a4fa0; display: block; }
    .message a {
      color: inherit;
      font-weight: 700;
      text-decoration: underline;
    }
    .message .big-id {
      display: inline-block;
      background: rgba(0,0,0,0.08);
      padding: 4px 12px;
      border-radius: 6px;
      font-family: monospace;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 1px;
    }
    .hidden { display: none !important; }
    .loading-view {
      text-align: center;
      padding: 60px 20px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">

    <div id="loadingView" class="loading-view">Checking login...</div>

    <div id="mainView" class="hidden">
      <div class="topbar">
        <h1>Report a Problem</h1>
        <div class="nav-links">
          <a href="my-complaints.html">My Complaints</a>
          <button class="logout" id="logoutBtn">Logout</button>
        </div>
      </div>

      <div class="welcome-box" id="welcomeBox"></div>
      <p class="subtitle">Tell us what's wrong. We'll route it to the warden.</p>

      <form id="complaintForm">
        <label for="student_name">Your Name</label>
        <input type="text" id="student_name" readonly />

        <label for="student_roll">Roll Number</label>
        <input type="text" id="student_roll" readonly />

        <label for="hostel">Hostel</label>
        <input type="text" id="hostel" readonly />

        <label for="room_number">Room Number</label>
        <input type="text" id="room_number" readonly />

        <label for="category">Category</label>
        <select id="category" required>
          <option value="">-- Select --</option>
          <option value="Electrical">Electrical (fan, light, AC, socket)</option>
          <option value="Plumbing">Plumbing (tap, shower, toilet, drain)</option>
          <option value="Carpentry">Carpentry (door, lock, window, furniture)</option>
          <option value="Cleaning">Cleaning (washroom, room, corridor)</option>
          <option value="Other">Other</option>
        </select>

        <label for="subcategory">Specific Problem</label>
        <input type="text" id="subcategory" required placeholder="e.g., Fan not working" />

        <label for="description">Description (optional)</label>
        <textarea id="description" placeholder="Any extra details..."></textarea>

        <label for="priority">Priority</label>
        <select id="priority">
          <option value="NORMAL">Normal</option>
          <option value="EMERGENCY">Emergency (urgent)</option>
        </select>

        <button type="submit" class="submit" id="submitBtn">Submit Complaint</button>

        <div id="message" class="message"></div>
      </form>
    </div>

  </div>

  <script>
    const loadingView = document.getElementById('loadingView');
    const mainView = document.getElementById('mainView');
    const welcomeBox = document.getElementById('welcomeBox');
    const form = document.getElementById('complaintForm');
    const submitBtn = document.getElementById('submitBtn');
    const messageBox = document.getElementById('message');
    const logoutBtn = document.getElementById('logoutBtn');

    let currentUser = null;

    function showMessage(html, type) {
      messageBox.innerHTML = html;
      messageBox.className = 'message ' + type;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    (async () => {
      try {
        const res = await fetch('/api/student/me');
        if (res.status === 401) {
          window.location.href = 'student-login.html';
          return;
        }
        const data = await res.json();
        currentUser = data.user;

        document.getElementById('student_name').value = currentUser.full_name || '';
        document.getElementById('student_roll').value = currentUser.roll_number || '';
        document.getElementById('hostel').value = currentUser.hostel || '';
        document.getElementById('room_number').value = currentUser.room_number || '';

        welcomeBox.innerHTML = '👋 Welcome, <strong>' +
          escapeHtml(currentUser.full_name) + '</strong> — ' +
          escapeHtml(currentUser.roll_number) + ', ' +
          escapeHtml(currentUser.hostel) + ', Room ' +
          escapeHtml(currentUser.room_number);

        loadingView.classList.add('hidden');
        mainView.classList.remove('hidden');
      } catch (err) {
        window.location.href = 'student-login.html';
      }
    })();

    logoutBtn.addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = 'student-login.html';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      messageBox.className = 'message';

      const payload = {
        student_name: currentUser.full_name,
        student_roll: currentUser.roll_number,
        hostel: currentUser.hostel,
        room_number: currentUser.room_number,
        category: document.getElementById('category').value,
        subcategory: document.getElementById('subcategory').value.trim(),
        description: document.getElementById('description').value.trim(),
        priority: document.getElementById('priority').value
      };

      try {
        const res = await fetch('/api/complaints', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          showMessage(data.error || 'Something went wrong.', 'error');
        } else if (data.duplicate) {
          showMessage(
            '⚠️ A similar complaint is already open.<br>' +
            'Complaint: <span class="big-id">' + escapeHtml(data.complaint_code) + '</span><br><br>' +
            '<a href="my-complaints.html">View it →</a>',
            'info'
          );
        } else {
          showMessage(
            '✅ Complaint submitted!<br>' +
            'Complaint: <span class="big-id">' + escapeHtml(data.complaint_code) + '</span><br><br>' +
            '<a href="my-complaints.html">Track it →</a>',
            'success'
          );
          document.getElementById('category').value = '';
          document.getElementById('subcategory').value = '';
          document.getElementById('description').value = '';
          document.getElementById('priority').value = 'NORMAL';
        }
      } catch (err) {
        showMessage('Cannot reach server. Is the backend running?', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Complaint';
      }
    });
  </script>
</body>
</html>
